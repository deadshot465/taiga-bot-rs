[package]
name = "taiga-bot-rs"
version = "6.7.2"
authors = ["Chehui Chou <deadshot465@users.noreply.github.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = ">=1.0.104"
async-openai = { git = "https://github.com/deadshot465/async-openai.git" }
base64 = ">=0.23.1"
chrono = { version = ">=0.4", features = ["serde"] }
dashmap = "6.2.1"
google-drive = ">=0.10.0"
image = ">=0.25.10"
num-traits = ">=0.2.19"
once_cell = ">=1.21.4"
openssl = { version = "0.10.81", features = ["vendored"] }
owoify_rs = ">=2.0.0"
poise = { version = "0.7.0", features = ["cache", "collector"] }
rand = ">=0.10.3"
regex = ">=1"
reqwest = { version = ">=0.13.5", features = ["blocking", "json"] }
serde = { version = ">=1.0", features = ["derive"] }
serde_json = ">=1.0"
serenity = { version = ">=0.12.5", features = ["cache", "collector", "gateway", "unstable_discord_api"] }
tokio = { version = ">=1.53.1", features = ["full", "parking_lot"] }
toml = ">=1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
log = "0.4.34"
time = { version = "0.3.55", features = ["serde", "serde-well-known"] }
tiktoken-rs = { version = "0.12.0", features = ["async-openai"] }

[profile.dev]
split-debuginfo = "unpacked"
